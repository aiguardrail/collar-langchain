[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-collar"
version = "1.0.1"
description = "LangChain tools for Collar Guardrail — deterministic pre-trade risk checks for AI trading agents on Robinhood Chain."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Collar"},
]
dependencies = [
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://collar-b46l.onrender.com"
Documentation = "https://collar-b46l.onrender.com/agent-docs.html"
Repository = "https://github.com/aiguardrail/collar-langchain"
Twitter = "https://x.com/collarfamily"

[tool.hatch.build.targets.wheel]
packages = ["langchain_collar"]
